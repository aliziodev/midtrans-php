name: Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, json, openssl
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate composer
        run: composer validate --strict

      - name: Run static analysis
        run: composer analyse

      - name: Run unit tests
        run: composer test:unit

      - name: Run dependency audit
        run: composer audit

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        with:
          # Pinned deliberately. Unpinned, npm resolved a preset wanting
          # conventional-changelog-writer@9 while the action bundles 8, which
          # killed the sibling package's first release on a missing Handlebars
          # helper minutes after this one succeeded with the same list. A release
          # pipeline whose outcome depends on what npm resolved that morning is
          # not reproducible.
          extra_plugins: |
            conventional-changelog-conventionalcommits@8.0.0
            @semantic-release/changelog@6.0.3
            @semantic-release/git@10.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
